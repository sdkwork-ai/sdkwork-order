[workspace]
resolver = "2"
members = [
    "crates/sdkwork-api-order-assembly",
    "crates/sdkwork-api-order-assembly",
  "crates/sdkwork-order-service",
  "crates/sdkwork-order-repository-sqlx",
  "crates/sdkwork-order-integration-account",
  "crates/sdkwork-order-integration-payment",
  "crates/sdkwork-order-integration-membership",
  "crates/sdkwork-order-integration-promotion",
  "crates/sdkwork-order-integration-physical-commerce",
  "crates/sdkwork-order-integration-partner",
  "crates/sdkwork-routes-order-app-api",
  "crates/sdkwork-routes-order-backend-api",
  "crates/sdkwork-order-database-host",
  "crates/sdkwork-order-service-host",
  "crates/sdkwork-api-order-standalone-gateway",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1.51", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
thiserror = "1"
async-trait = "0.1"
sdkwork_contract_service = { path = "../sdkwork-account/crates/sdkwork-contract-service", package = "sdkwork-contract-service" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork_iam_context_service = { path = "../sdkwork-iam/crates/sdkwork-iam-context-service", package = "sdkwork-iam-context-service" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config" }
sdkwork-database-history = { path = "../sdkwork-database/crates/sdkwork-database-history", features = ["postgres"] }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle", features = ["postgres"] }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", features = ["postgres"] }
sdkwork-database-id = { path = "../sdkwork-database/crates/sdkwork-database-id", features = ["postgres"] }
sdkwork_order_service = { path = "crates/sdkwork-order-service", package = "sdkwork-order-service" }
sdkwork_payment_service = { path = "../sdkwork-payment/crates/sdkwork-payment-service", package = "sdkwork-payment-service" }
sdkwork_order_repository_sqlx = { path = "crates/sdkwork-order-repository-sqlx", package = "sdkwork-order-repository-sqlx" }
sdkwork_payment_repository_sqlx = { path = "../sdkwork-payment/crates/sdkwork-payment-repository-sqlx", package = "sdkwork-payment-repository-sqlx" }
sdkwork_payment_providers = { path = "../sdkwork-payment/crates/sdkwork-payment-providers", package = "sdkwork-payment-providers" }
sdkwork-routes-order-app-api = { path = "crates/sdkwork-routes-order-app-api" }
sdkwork-routes-order-backend-api = { path = "crates/sdkwork-routes-order-backend-api" }
sdkwork_api_order_assembly = { path = "crates/sdkwork-api-order-assembly", package = "sdkwork-api-order-assembly" }
sdkwork_order_database_host = { path = "crates/sdkwork-order-database-host", package = "sdkwork-order-database-host" }
sdkwork_order_service_host = { path = "crates/sdkwork-order-service-host", package = "sdkwork-order-service-host" }
sdkwork_order_integration_account = { path = "crates/sdkwork-order-integration-account", package = "sdkwork-order-integration-account" }
sdkwork_order_integration_payment = { path = "crates/sdkwork-order-integration-payment", package = "sdkwork-order-integration-payment" }
sdkwork_order_integration_membership = { path = "crates/sdkwork-order-integration-membership", package = "sdkwork-order-integration-membership" }
sdkwork_order_integration_promotion = { path = "crates/sdkwork-order-integration-promotion", package = "sdkwork-order-integration-promotion" }
sdkwork_order_integration_physical_commerce = { path = "crates/sdkwork-order-integration-physical-commerce", package = "sdkwork-order-integration-physical-commerce" }
sdkwork_order_integration_partner = { path = "crates/sdkwork-order-integration-partner", package = "sdkwork-order-integration-partner" }
sdkwork_commerce_partner_service = { path = "../sdkwork-partner/crates/sdkwork-commerce-partner-service", package = "sdkwork-commerce-partner-service" }
sdkwork_commerce_partner_repository_sqlx = { path = "../sdkwork-partner/crates/sdkwork-commerce-partner-repository-sqlx", package = "sdkwork-commerce-partner-repository-sqlx" }
sdkwork_merchandise_service = { path = "../sdkwork-merchandise/crates/sdkwork-merchandise-service", package = "sdkwork-merchandise-service" }
sdkwork_merchandise_repository_sqlx = { path = "../sdkwork-merchandise/crates/sdkwork-merchandise-repository-sqlx", package = "sdkwork-merchandise-repository-sqlx" }
sdkwork_shop_service = { path = "../sdkwork-shop/crates/sdkwork-shop-service", package = "sdkwork-shop-service" }
sdkwork_shop_repository_sqlx = { path = "../sdkwork-shop/crates/sdkwork-shop-repository-sqlx", package = "sdkwork-shop-repository-sqlx" }
sdkwork_commerce_promotion_service = { path = "../sdkwork-promotion/crates/sdkwork-commerce-promotion-service", package = "sdkwork-commerce-promotion-service" }
sdkwork_commerce_promotion_repository_sqlx = { path = "../sdkwork-promotion/crates/sdkwork-commerce-promotion-repository-sqlx", package = "sdkwork-commerce-promotion-repository-sqlx" }
sdkwork_membership_repository_sqlx = { path = "../sdkwork-membership/crates/sdkwork-membership-repository-sqlx", package = "sdkwork-membership-repository-sqlx" }
sdkwork_account_service = { path = "../sdkwork-account/crates/sdkwork-account-service", package = "sdkwork-account-service" }
sdkwork_account_repository_sqlx = { path = "../sdkwork-account/crates/sdkwork-account-repository-sqlx", package = "sdkwork-account-repository-sqlx" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
