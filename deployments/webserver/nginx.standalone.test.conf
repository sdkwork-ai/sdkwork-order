# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/order/webserver.pid;
error_log /var/log/sdkwork/order/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name order-test.sdkwork.com order-test.birdcoder.com order-test.dtupay.com order-test.sdkwork.cn order-test.birdcoder.cn order-test.dtupay.cn order-test.skubc.com order-test.skubc.cn order-test.zowalk.com order-test.zowalk.cn order-test.offer86.com order-test.offer86.cn order-test.86offer.com order-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
