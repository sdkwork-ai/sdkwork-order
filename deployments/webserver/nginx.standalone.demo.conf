# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/order/webserver.pid;
error_log /var/log/sdkwork/order/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name order-demo.sdkwork.com order-demo.birdcoder.com order-demo.dtupay.com order-demo.noaper.com order-demo.sdkwork.cn order-demo.birdcoder.cn order-demo.dtupay.cn order-demo.noaper.cn order-demo.skubc.com order-demo.skubc.cn order-demo.zowalk.com order-demo.zowalk.cn order-demo.offer86.com order-demo.offer86.cn order-demo.86offer.com order-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/order/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
