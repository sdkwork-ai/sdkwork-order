# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/order/webserver.pid;
error_log /var/log/sdkwork/order/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name order-staging.sdkwork.com order-staging.birdcoder.com order-staging.dtupay.com order-staging.sdkwork.cn order-staging.birdcoder.cn order-staging.dtupay.cn order-staging.skubc.com order-staging.skubc.cn order-staging.zowalk.com order-staging.zowalk.cn order-staging.offer86.com order-staging.offer86.cn order-staging.86offer.com order-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
